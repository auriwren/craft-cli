[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-cli"
version = "0.1.0"
description = "CLI tool for Craft.do document management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0", "responses>=0.23"]

[project.scripts]
craft-cli = "craft_cli.cli:cli"

[tool.setuptools.packages.find]
include = ["craft_cli*"]
